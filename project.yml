name: Moozic
options:
  bundleIdPrefix: com.chrissss
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  Moozic:
    type: application
    platform: iOS
    sources:
      - Moozic
    info:
      path: Moozic/Resources/Info.plist
      properties:
        CFBundleDisplayName: Moozic
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # Self-hosted servers are often reached over plain HTTP on the LAN.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Moozic connects to your music server on the local network.
        # Default OAuth redirect: com.chrissss.moozic:/oauth2redirect (RFC 8252 private-use scheme).
        CFBundleURLTypes:
          - CFBundleURLName: com.chrissss.moozic.oauth
            CFBundleURLSchemes: [com.chrissss.moozic]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chrissss.moozic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
  MoozicTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MoozicTests
    dependencies:
      - target: Moozic
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Moozic:
    build:
      targets:
        Moozic: all
        MoozicTests: [test]
    test:
      targets:
        - MoozicTests
