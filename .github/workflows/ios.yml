name: iOS

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create, e.g. v1.0.0 (leave empty to just build and test)"
        required: false
        type: string

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          xcodebuild test \
            -quiet \
            -project Moozic.xcodeproj \
            -scheme Moozic \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO

  # Push a tag like `v1.2.0` (or run the workflow manually with a version) to publish
  # a GitHub Release with an unsigned .ipa.
  # iOS only installs signed apps: sideload it with AltStore/SideStore/Sideloadly,
  # which re-sign it with your Apple ID.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: build-and-test
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned Release app
        run: |
          xcodebuild build \
            -quiet \
            -project Moozic.xcodeproj \
            -scheme Moozic \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="${TAG#v}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Moozic.app Payload/
          zip -qry "Moozic-${TAG}-unsigned.ipa" Payload

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IPA="Moozic-${TAG}-unsigned.ipa"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-running a version replaces its build.
            gh release upload "$TAG" "$IPA" --clobber
          else
            # Creates the tag on this commit when it doesn't exist yet (manual runs).
            gh release create "$TAG" "$IPA" \
              --target "$GITHUB_SHA" \
              --title "Moozic $TAG" \
              --generate-notes \
              --notes "Unsigned build – install with AltStore, SideStore or Sideloadly, which re-sign it with your Apple ID."
          fi

      # AltStore source listing every release, attached to the latest release so its URL never changes:
      # https://github.com/<owner>/<repo>/releases/latest/download/source.json
      - name: Update AltStore source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          python3 scripts/altstore_source.py releases.json "$GITHUB_REPOSITORY" > source.json
          LATEST=$(gh release view --json tagName --jq .tagName)
          gh release upload "$LATEST" source.json --clobber
